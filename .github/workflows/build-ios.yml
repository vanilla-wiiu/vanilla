name: Build iOS
on:
  workflow_call:
jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Configure iOS
      run: |
        cmake -S . -B build -G Xcode --toolchain cmake/ios-toolchain.cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

    - name: Build iOS
      run: cmake --build build --config Release --target vanilla

    - name: Create unsigned IPA
      run: |
        APP=build/bin/Release/Vanilla.app
        test -d "$APP"
        mkdir -p Payload
        cp -R "$APP" Payload/
        zip -9rX vanilla-ios.ipa Payload

    - name: Upload iOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios
        path: vanilla-ios.ipa
        if-no-files-found: error

  publish-ios:
    needs: build-ios
    uses: ./.github/workflows/publish-continuous.yml
    with:
      artifact-name: ios
      artifact-path: vanilla-ios.ipa
