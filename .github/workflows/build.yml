name: Build
on:
  push:
    paths-ignore:
    - 'README.md'
  pull_request:
    paths-ignore:
    - 'README.md'
permissions:
  contents: write
  packages: write
jobs:
  build-ios:
    uses: ./.github/workflows/build-ios.yml

  build-macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            arch: x86_64
            artifact: vanilla-linux-x86_64.tar.gz
          - os: linux
            arch: aarch64
            artifact: vanilla-linux-aarch64.tar.gz
          - os: windows
            arch: x86_64
            artifact: vanilla-windows-x86_64.zip
          - os: android
            arch: universal
            artifact: vanilla-android-universal.apk
          - os: raspberrypi0w
            arch: armv6l
            artifact: vanilla-raspberrypi0w-image.zip
          - os: raspberrypi64
            arch: aarch64
            artifact: vanilla-raspberrypi64-image.zip
          - os: orangepi_zero2w
            arch: aarch64
            artifact: vanilla-orangepi_zero2w-image.zip
          - os: orangepi_zero3
            arch: aarch64
            artifact: vanilla-orangepi_zero3-image.zip
          - os: nintendoswitch
            arch: aarch64
            artifact: vanilla-nintendoswitch-image.zip
    uses: ./.github/workflows/build-platform.yml
    with:
      platform-os: ${{ matrix.platform.os }}
      platform-arch: ${{ matrix.platform.arch }}
      artifact-path: ${{ matrix.platform.artifact }}
    secrets: inherit
